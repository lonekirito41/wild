<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wild Life Seasonal Tracker | Seasons</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="seasons">
  <header class="site-header"></header>
  <main class="page-main">
    <section class="page-title reveal"><p class="eyebrow">Seasonal Wildlife</p><h1>Seasonal Wildlife</h1><p>Discover wildlife through the changing seasons.</p></section>
    <section class="section">
      <div class="season-cards reveal" id="seasonCards">
        <button data-season="Spring">🌸 Spring</button><button data-season="Summer">☀️ Summer</button><button class="active" data-season="Monsoon">🌧️ Monsoon</button><button data-season="Winter">❄️ Winter</button>
      </div>
      <div class="season-panel reveal"><h2 id="seasonTitle">Monsoon Wildlife</h2><div class="mini-list" id="seasonWildlife"></div></div>
      <div class="section-heading reveal"><p class="eyebrow">Your Encounters This Season</p><h2>Season Summary</h2></div>
      <div class="stat-grid"><article class="stat-card reveal"><strong data-count="9">0</strong><span>Encounters</span></article><article class="stat-card reveal"><strong data-count="4">0</strong><span>Animals</span></article><article class="stat-card reveal"><strong data-count="3">0</strong><span>Locations</span></article></div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
