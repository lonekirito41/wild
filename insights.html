<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wild Life Seasonal Tracker | Insights</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="insights">
  <header class="site-header"></header>
  <main class="page-main">
    <section class="page-title reveal"><p class="eyebrow">Analytics</p><h1>Wildlife Insights</h1><p>Patterns from your observation journey.</p></section>
    <section class="section"><div class="stat-grid" id="insightStats"><article class="stat-card reveal"><strong>0</strong><span>Total Encounters</span></article><article class="stat-card reveal"><strong>0</strong><span>Unique Animals</span></article><article class="stat-card reveal"><strong>0</strong><span>Locations Explored</span></article><article class="stat-card reveal"><strong>—</strong><span>Most Active Season</span></article></div></section>
    <section class="section analytics-grid">
      <article class="chart-card reveal"><h2>Most Observed Animals</h2><div class="bar-chart" id="animalBars"></div></article>
      <article class="chart-card reveal"><h2>Seasonal Activity</h2><div class="season-bars" id="seasonBars"></div></article>
    </section>
    <section class="section"><div class="section-heading reveal"><p class="eyebrow">Observation Journey</p><h2>Recent Movement</h2></div><div class="timeline reveal" id="insightTimeline"></div></section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
