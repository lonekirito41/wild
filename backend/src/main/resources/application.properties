server.port=${PORT:${SERVER_PORT:8080}}
server.tomcat.threads.max=40
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/wildlife_tracker_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=12h
