<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wildlife Explorer | Sighting Map</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="animal-map">
  <header class="site-header"></header>
  <main class="page-main">
    <section class="page-title reveal"><p class="eyebrow">Mock Map</p><h1>Asian Elephant - Sighting Map</h1><p>A UI-only terrain panel showing observation clusters.</p></section>
    <section class="section">
      <div class="mock-map reveal" id="mockMap">
        <div class="river"></div><div class="road road-a"></div><div class="road road-b"></div>
        <span class="tree t1"></span><span class="tree t2"></span><span class="tree t3"></span><span class="tree t4"></span>
        <button class="map-pin" style="left:22%;top:35%" data-place="Periyar">📍 Periyar</button>
        <button class="map-pin" style="left:58%;top:30%" data-place="Wayanad">📍 Wayanad</button>
        <button class="map-pin" style="left:42%;top:62%" data-place="Silent Valley">📍 Silent Valley</button>
        <button class="map-pin" style="left:73%;top:68%" data-place="Eravikulam">📍 Eravikulam</button>
        <div class="map-popup" id="mapPopup"><strong>Asian Elephant</strong><span>Periyar</span><span>19 September 2026</span><span>6:42 PM</span><span>Monsoon</span></div>
      </div>
      <div class="stat-grid map-stats"><article class="stat-card reveal"><strong data-count="12">0</strong><span>Total Sightings</span></article><article class="stat-card reveal"><strong data-count="4">0</strong><span>Locations</span></article><article class="stat-card reveal"><strong data-count="3">0</strong><span>Seasons</span></article></div>
      <div class="journey reveal">Periyar <span>→</span> Wayanad <span>→</span> Silent Valley <span>→</span> Eravikulam</div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
