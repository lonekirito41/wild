<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wildlife Explorer | Identifier</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="identifier">
  <header class="site-header"></header>
  <main class="page-main">
    <section class="page-title reveal"><p class="eyebrow">Smart Suggestion</p><h1>Wildlife Identifier</h1><p>Explore wildlife based on where you observed it.</p></section>
    <section class="section identifier-shell reveal">
      <div class="form-grid">
        <label>Animal<select id="identifierAnimal"><option>Search or select animal</option><option>Asian Elephant</option><option>Sambar Deer</option><option>Indian Gaur</option></select></label>
        <label>Location<select id="identifierLocation"><option>Periyar</option><option>Wayanad</option><option>Silent Valley</option><option>Eravikulam</option></select></label>
      </div>
      <div class="suggestion-panel" id="identifierSuggestions"></div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
